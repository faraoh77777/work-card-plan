el><button class="primary">내역 저장</button></form></dialog><dialog id="importDlg" style="width:min(720px,96vw);max-height:92vh"><div class="row"><h3>카드사 엑셀 불러오기</h3><button type="button" onclick="document.querySelector('#importDlg').close()" aria-label="닫기">✕</button></div><div id="importBody" style="display:grid;gap:12px"></div></dialog><input type="file" id="importFile" accept=".xlsx,.xls,.csv,.txt,.htm,.html" hidden><datalist id="cardList"></datalist><datalist id="cardListAll"></datalist><div id="toast" role="status"></div><script>
// 중복공제 판별: 화면 코드와 분리한 순수 계산 함수.
// 카드 소득공제와 다른 공제(의료비·교육비 세액공제)를 함께 받을 수 있는 사용구분의 금액만 모읍니다. 실제 세액은 계산하지 않습니다.
const OVERLAP_RULES={'의료비':{other:'의료비 세액공제',note:'총급여의 3%를 넘는 금액부터 공제됩니다. 실손보험금으로 돌려받은 금액은 의료비에서 빠집니다.'},'교복':{other:'교육비 세액공제',note:'중·고등학생 교복 구입비만 해당하며 학생 1명당 연 50만원까지 교육비로 인정됩니다.'},'취학전 학원비':{other:'교육비 세액공제',note:'취학 전 아동의 학원·체육시설 수강료만 해당합니다. 초·중·고 학원비는 교육비 공제 대상이 아닙니다.'}};
function findOverlap(records,year){const groups=Object.keys(OVERLAP_RULES).map(category=>{const items=records.filter(r=>+r.date.slice(0,4)===year&&r.category===category);return{category,...OVERLAP_RULES[category],count:items.length,total:items.reduce((n,r)=>n+r.amount,0)}});return{groups,count:groups.reduce((n,g)=>n+g.count,0),total:groups.reduce((n,g)=>n+g.total,0)}}
// 카드사별 집계: 화면 코드와 분리한 순수 함수. 카드사 이름(card)은 직접 입력하거나 엑셀 불러오기에서 정한 값입니다.
// 카드 소득공제액은 모든 카드를 합산해 계산하므로(최저사용액 기준) 카드사별 공제액은 나누지 않고 사용액만 집계합니다.
const CARD_NONE='카드사 미지정',CARD_CASH='현금영수증',CASH_PLAIN='현금사용';
const CARD_ISSUERS=[['삼성카드',/삼성카드|samsung\s?card/i],['현대카드',/현대카드|hyundai\s?card/i],['KB국민카드',/KB국민|국민카드|KB카드|kbcard|KB\s?Pay/i],['신한카드',/신한카드|신한은행|shinhan/i],['롯데카드',/롯데카드|lotte\s?card/i],['우리카드',/우리카드|우리은행|woori/i],['하나카드',/하나카드|하나은행|hana\s?card/i],['BC카드',/비씨카드|BC카드|bc\s?card/i],['NH농협카드',/농협|NH카드|nh\s?card/i],['IBK기업은행',/기업은행|IBK/i],['카카오뱅크',/카카오뱅크|kakaobank/i],['토스뱅크',/토스뱅크|toss\s?bank/i],['케이뱅크',/케이뱅크|k\s?bank/i],['씨티카드',/씨티|citi/i],['SC제일은행',/SC제일|제일은행/],['우체국',/우체국/],['새마을금고',/새마을금고/],['수협',/수협/],['iM뱅크',/iM뱅크|대구은행|DGB/i],['부산은행',/부산은행/],['경남은행',/경남은행/],['광주은행',/광주은행/],['전북은행',/전북은행/],['제주은행',/제주은행/]];
function cardGroupOf(r){return r.method==='현금영수증'?CARD_CASH:(r.card&&r.card.trim())||CARD_NONE}
// month가 0이면 연간. excluded: 공제 제외 사용구분 목록(CARD_EXCLUDED).
// 현금사용(영수증 없는 현금·이체)은 카드가 아니라 카드사별 집계에서 뺍니다.
function summarizeByCard(records,year,month,excluded){const items=records.filter(r=>r.method!==CASH_PLAIN&&+r.date.slice(0,4)===year&&(!month||+r.date.slice(5,7)===month)),map={};
for(const r of items){const k=cardGroupOf(r),g=map[k]||(map[k]={card:k,count:0,total:0,credit:0,debit:0,cash:0,excludedUse:0,byMonth:Array(12).fill(0),byCategory:{},items:[]});g.count++;g.total+=r.amount;if(r.method==='신용카드')g.credit+=r.amount;else if(r.method==='체크카드')g.debit+=r.amount;else g.cash+=r.amount;if((excluded||[]).includes(r.category))g.excludedUse+=r.amount;g.byMonth[+r.date.slice(5,7)-1]+=r.amount;g.byCategory[r.category]=(g.byCategory[r.category]||0)+r.amount;g.items.push(r)}
const order=k=>k===CARD_NONE?2:k===CARD_CASH?1:0,groups=Object.values(map).sort((a,b)=>order(a.card)-order(b.card)||b.total-a.total);groups.forEach(g=>g.items.sort((a,b)=>b.date.localeCompare(a.date)));return{groups,total:groups.reduce((n,g)=>n+g.total,0),count:items.length}}
function cashReceiptStatus(records,year){const items=records.filter(r=>+r.date.slice(0,4)===year&&r.method==='현금영수증'),unchecked=items.filter(r=>!r.ntsChecked);return{count:items.length,checked:items.length-unchecked.length,unchecked:unchecked.length,uncheckedTotal:unchecked.reduce((n,r)=>n+r.amount,0)}}
</script><script>
// 카드 소득공제 계산: 화면 코드와 분리한 순수 계산 함수(DOM 없음).
// work-tax-planner js/engine.js의 classifyExpense·computeCard와 rules/2025.js의 card 블록을 옮겼습니다.
// 이 앱에 입력 항목이 없는 가족 합산·재직기간·환불·중고차·수영장/체력단련장 분기는 생략했습니다. 환급액은 계산하지 않습니다.
const CARD_RULES_2025={minUseRate:0.25,rates:{CREDIT:0.15,DEBIT:0.30,CULTURE:0.30,TRADITIONAL_MARKET:0.40,PUBLIC_TRANSIT:0.40},cultureGrossCap:70000000,limitTiers:[{grossUpTo:70000000,basic:3000000,extra:3000000},{grossUpTo:null,basic:2500000,extra:2000000}],source:'국세청 2025년 귀속 연말정산 안내 p.28·p.41 · 조특법 §126의2'};
function cardRulesForYear(y){if(y===2025)return{rules:CARD_RULES_2025,basis:'2025 귀속 기준'};if(y===2026)return{rules:CARD_RULES_2025,basis:'2025 기준 적용',note:'2026년은 2025 귀속 기준으로 계산했습니다. 2026 개정(자녀 한도 가산 등)은 반영되지 않았습니다.'};return null}
// 공제 제외 사용구분: rules/2025.js card.excludedCategories와 같은 목록. 사용액에는 들어가지만 공제 계산에서는 빠집니다(engine의 EXCLUDED → bucket null).
const CARD_EXCLUDED=['세금·공과금','보험료','통신비','아파트관리비','대출 상환','대학등록금','상품권','면세점','해외사용','신차 구입','월세(세액공제분)','경조사비','용돈·가족 송금','모임 회비','저축·투자','기부금','개인 간 거래'];
// 한 건은 한 버킷에만: A 신용카드 / B 체크카드·현금영수증 / C 문화비(총급여 7천만원 이하) / D 전통시장 / E 대중교통
function cardBucket(r,gross,c){if(CARD_EXCLUDED.includes(r.category))return null;const pm=r.method==='신용카드'?'A':'B';if(r.category==='전통시장')return'D';if(r.category==='대중교통')return'E';if(r.category==='문화비')return gross<=c.cultureGrossCap?'C':pm;return pm}
// 정수 나누기: total을 weights 비율로 나누고(내림) 남는 원은 가장 큰 항목에 더합니다.

async function syncInit(){if(!SB_URL||!SB_KEY)return;try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src=SB_LIB;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}catch(e){syncErr='동기화 서버에 연결하지 못했습니다(인터넷 확인). 지금은 이 기기에만 저장됩니다.';if(page==='settings')render();return}
sb=supabase.createClient(SB_URL,SB_KEY);const{data}=await sb.auth.getSession();sbUser=data.session?.user||null;
sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?.user||null;if((u&&u.id)===(sbUser&&sbUser.id))return;sbUser=u;syncReady=false;syncAt=null;if(page==='settings')render();if(u)syncPull()});
if(page==='settings')render();if(sbUser)syncPull();

syncInit();
