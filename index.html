// 카드사 엑셀 불러오기: 파일 읽기와 확인 화면(DOM). 표 해석은 위의 parseCardSheet(순수 함수)가 합니다.
// .xlsx·.xls(엑셀 원본)·XML 형식 엑셀을 읽을 때만 SheetJS를 cdnjs에서 받아옵니다. HTML 표 형식 .xls와 CSV는 라이브러리 없이 읽습니다.
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';let importState=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src=XLSX_URL;s.onload=ok;s.onerror=()=>{s.remove();no(new Error('엑셀 읽기 도구를 받지 못했습니다. 인터넷 연결을 확인해 주세요.'))};document.head.appendChild(s)})}
function decodeText(buf){if(buf[0]===0xff&&buf[1]===0xfe)return new TextDecoder('utf-16le').decode(buf.subarray(2));if(buf[0]===0xfe&&buf[1]===0xff)return new TextDecoder('utf-16be').decode(buf.subarray(2));if(buf[0]===0xef&&buf[1]===0xbb&&buf[2]===0xbf)return new TextDecoder('utf-8').decode(buf.subarray(3));try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('euc-kr').decode(buf)}}
function parseCsv(text){const head=text.slice(0,2000),d=(head.match(/\t/g)||[]).length>(head.match(/,/g)||[]).length?'\t':',',rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows}
// leafOnly: 웹 화면에서 복사한 표는 화면 배치용 바깥 표 안에 내역 표가 들어 있을 수 있어, 안쪽 표가 없는 표만 씁니다.
function htmlTables(text,leafOnly){const doc=new DOMParser().parseFromString(text,'text/html');return [...doc.querySelectorAll('table')].filter(t=>!leafOnly||!t.querySelector('table')).map(t=>{const grid=[];[...t.rows].forEach((r,ri)=>{const row=grid[ri]||(grid[ri]=[]);let c=0;for(const cell of r.cells){while(row[c]!==undefined)c++;const v=cell.textContent.replace(/\s+/g,' ').trim(),rs=Math.max(1,cell.rowSpan||1),cs=Math.max(1,cell.colSpan||1);for(let i=0;i<rs;i++){const g=grid[ri+i]||(grid[ri+i]=[]);for(let j=0;j<cs;j++)g[c+j]=i||j?'':v}c+=cs}});return grid.map(r=>Array.from(r,v=>v??''))})}
